services:
  - type: web
    name: have2want-plus
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_PI_SANDBOX
        value: "false"
      - key: PI_API_KEY
        sync: false
